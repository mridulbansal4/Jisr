# /etc/nginx/sites-available/jisr  (symlinked into sites-enabled)
# HTTP first; `certbot --nginx -d jisr.duckdns.org` adds the HTTPS server block once DNS points here.
server {
    listen 80;
    server_name jisr.duckdns.org;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # API (FastAPI): same origin, so the browser needs no CORS for these paths.
    location /v1/ {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
