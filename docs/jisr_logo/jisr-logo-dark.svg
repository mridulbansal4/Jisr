<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <!-- Anodized Micro-Grain Texture -->
    <filter id="grain-dk" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.48 0 0 0 0.07 0" in="noise" result="cn"/>
      <feComposite operator="in" in="cn" in2="SourceGraphic" result="clip"/>
      <feBlend mode="overlay" in="clip" in2="SourceGraphic"/>
    </filter>

    <!-- 3D Cast Shadow -->
    <filter id="shadow-dk" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0.9" dy="3.5" stdDeviation="3.2" flood-color="#000000" flood-opacity="0.78"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <!-- Apple Squircle Plinth Gradients (Dark #151412) -->
    <linearGradient id="plinth-dk" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#2a2824"/>
      <stop offset="48%" stop-color="#191815"/>
      <stop offset="100%" stop-color="#0e0d0b"/>
    </linearGradient>
    <radialGradient id="plinth-glow-dk" cx="37%" cy="8%" r="78%">
      <stop offset="0%" stop-color="#8dbcbf" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#e2b46f" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#151412" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plinth-rim-dk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="40%" stop-color="#8dbcbf" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Left Arch: Brushed Pearlescent Ivory -->
    <linearGradient id="arch-l-out-dk" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f2eee6"/>
      <stop offset="100%" stop-color="#cbc4b8"/>
    </linearGradient>
    <linearGradient id="arch-l-in-dk" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#dcd5c9"/>
      <stop offset="55%" stop-color="#b5aea0"/>
      <stop offset="100%" stop-color="#857e72"/>
    </linearGradient>

    <!-- Right Arch: Anodized Mineral Sea-Teal -->
    <linearGradient id="arch-r-out-dk" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#b8dcde"/>
      <stop offset="45%" stop-color="#76a8ac"/>
      <stop offset="100%" stop-color="#3c6d71"/>
    </linearGradient>
    <linearGradient id="arch-r-in-dk" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#588a8e"/>
      <stop offset="55%" stop-color="#346165"/>
      <stop offset="100%" stop-color="#1b3a3d"/>
    </linearGradient>

    <!-- Left V-Chevron: Deep Architectural Obsidian -->
    <linearGradient id="chev-l-up-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#384046"/>
      <stop offset="50%" stop-color="#202529"/>
      <stop offset="100%" stop-color="#111417"/>
    </linearGradient>
    <linearGradient id="chev-l-lo-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d2226"/>
      <stop offset="100%" stop-color="#090b0d"/>
    </linearGradient>

    <!-- Right V-Chevron: Specular Mineral Teal -->
    <linearGradient id="chev-r-up-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4e3e5"/>
      <stop offset="48%" stop-color="#85b5b8"/>
      <stop offset="100%" stop-color="#528286"/>
    </linearGradient>
    <linearGradient id="chev-r-lo-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#609094"/>
      <stop offset="55%" stop-color="#3a676b"/>
      <stop offset="100%" stop-color="#1f3f42"/>
    </linearGradient>

    <!-- Outer Buttress Wings -->
    <linearGradient id="wing-l-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6c70"/>
      <stop offset="100%" stop-color="#22383b"/>
    </linearGradient>
    <linearGradient id="wing-r-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3e5e62"/>
      <stop offset="100%" stop-color="#1a2e31"/>
    </linearGradient>

    <!-- Central Orbital Sphere: Brushed Dawn-Gold & Bounce Light -->
    <radialGradient id="orb-dk" cx="50%" cy="50%" r="52%" fx="37%" fy="23%">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="16%" stop-color="#fae5b2"/>
      <stop offset="42%" stop-color="#dfb26c"/>
      <stop offset="72%" stop-color="#9e6d36"/>
      <stop offset="92%" stop-color="#523418"/>
      <stop offset="100%" stop-color="#2e1b0b"/>
    </radialGradient>
    <linearGradient id="orb-bounce-dk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8dbcbf" stop-opacity="0"/>
      <stop offset="70%" stop-color="#8dbcbf" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8dbcbf" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="cable-dk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b278" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e2b46f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8dbcbf" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Apple G2 Continuous-Curvature Squircle Plinth -->
  <path d="M 42 6 L 86 6 C 104 6, 113 6, 117.5 10.5 C 122 15, 122 24, 122 42 L 122 86 C 122 104, 122 113, 117.5 117.5 C 113 122, 104 122, 86 122 L 42 122 C 24 122, 15 122, 10.5 117.5 C 6 113, 6 104, 6 86 L 6 42 C 6 24, 6 15, 10.5 10.5 C 15 6, 24 6, 42 6 Z" fill="url(#plinth-dk)" filter="url(#grain-dk)"/>
  <path d="M 42 6 L 86 6 C 104 6, 113 6, 117.5 10.5 C 122 15, 122 24, 122 42 L 122 86 C 122 104, 122 113, 117.5 117.5 C 113 122, 104 122, 86 122 L 42 122 C 24 122, 15 122, 10.5 117.5 C 6 113, 6 104, 6 86 L 6 42 C 6 24, 6 15, 10.5 10.5 C 15 6, 24 6, 42 6 Z" fill="url(#plinth-glow-dk)"/>
  <path d="M 42 6 L 86 6 C 104 6, 113 6, 117.5 10.5 C 122 15, 122 24, 122 42 L 122 86 C 122 104, 122 113, 117.5 117.5 C 113 122, 104 122, 86 122 L 42 122 C 24 122, 15 122, 10.5 117.5 C 6 113, 6 104, 6 86 L 6 42 C 6 24, 6 15, 10.5 10.5 C 15 6, 24 6, 42 6 Z" fill="none" stroke="url(#plinth-rim-dk)" stroke-width="1.25"/>

  <!-- 5 Golden Suspension Harp Filaments -->
  <g stroke="url(#cable-dk)" stroke-width="0.85" stroke-linecap="round">
    <line x1="54" y1="35" x2="54" y2="83"/>
    <line x1="59" y1="34" x2="59" y2="88"/>
    <line x1="64" y1="33.5" x2="64" y2="92"/>
    <line x1="69" y1="34" x2="69" y2="88"/>
    <line x1="74" y1="35" x2="74" y2="83"/>
  </g>

  <!-- 3D Architectural Emblem -->
  <g filter="url(#shadow-dk)">
    <!-- Upper Concentric Split-Bevel Bridge Arch -->
    <path d="M 21 62 A 43 43 0 0 1 64 19 L 64 26.5 A 35.5 35.5 0 0 0 28.5 62 Z" fill="url(#arch-l-out-dk)"/>
    <path d="M 28.5 62 A 35.5 35.5 0 0 1 64 26.5 L 64 34.5 A 27.5 27.5 0 0 0 36.5 62 Z" fill="url(#arch-l-in-dk)"/>
    <path d="M 64 19 A 43 43 0 0 1 107 62 L 99.5 62 A 35.5 35.5 0 0 0 64 26.5 Z" fill="url(#arch-r-out-dk)"/>
    <path d="M 64 26.5 A 35.5 35.5 0 0 1 99.5 62 L 91.5 62 A 27.5 27.5 0 0 0 64 34.5 Z" fill="url(#arch-r-in-dk)"/>

    <!-- Specular Ridge Hairlines on Upper Arch -->
    <path d="M 28.5 62 A 35.5 35.5 0 0 1 64 26.5" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="0.7"/>
    <path d="M 64 26.5 A 35.5 35.5 0 0 1 99.5 62" fill="none" stroke="#d4f0f2" stroke-opacity="0.45" stroke-width="0.7"/>
    <line x1="64" y1="19" x2="64" y2="34.5" stroke="#000000" stroke-opacity="0.35" stroke-width="0.8"/>

    <!-- Outer Buttress Wings -->
    <polygon points="24.5,71 34.5,91.5 49,94 40,85" fill="url(#wing-l-dk)"/>
    <polyline points="24.5,71 34.5,91.5 49,94" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.6"/>
    <polygon points="103.5,71 93.5,91.5 79,94 88,85" fill="url(#wing-r-dk)"/>
    <polyline points="103.5,71 93.5,91.5 79,94" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="0.6"/>

    <!-- Lower Multi-Faceted V-Chevron Base -->
    <polygon points="29.8,65.5 39.2,65.5 64,90.3 64,99.7" fill="url(#chev-l-up-dk)"/>
    <polygon points="20.5,65.5 29.8,65.5 64,99.7 64,109" fill="url(#chev-l-lo-dk)"/>
    <polygon points="64,90.3 88.8,65.5 98.2,65.5 64,99.7" fill="url(#chev-r-up-dk)"/>
    <polygon points="64,99.7 98.2,65.5 107.5,65.5 64,109" fill="url(#chev-r-lo-dk)"/>

    <!-- Specular Chamfer Ridge Lines on V-Chevron -->
    <line x1="29.8" y1="65.5" x2="64" y2="99.7" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.65"/>
    <line x1="98.2" y1="65.5" x2="64" y2="99.7" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.7"/>
    <line x1="20.5" y1="65.5" x2="39.2" y2="65.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.65"/>
    <line x1="88.8" y1="65.5" x2="107.5" y2="65.5" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.65"/>

    <!-- Central Brushed Dawn-Gold Orbital Sphere -->
    <circle cx="64" cy="62.5" r="14.8" fill="url(#orb-dk)"/>
    <circle cx="64" cy="62.5" r="14.8" fill="url(#orb-bounce-dk)"/>
    <circle cx="64" cy="62.5" r="14.5" fill="none" stroke="#fff6df" stroke-opacity="0.32" stroke-width="0.55"/>
  </g>
</svg>
